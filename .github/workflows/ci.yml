name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check installed CLI
        run: python -m face_detection --help

  package:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel outside the source tree
        run: |
          python -m pip install dist/*.whl
          cd "${{ runner.temp }}"
          face-detect --help
          python -c "from face_detection import FaceDetector; FaceDetector(); print('Bundled cascade loaded successfully')"
      - name: Save distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
